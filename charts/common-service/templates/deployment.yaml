apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common-service.fullname" . }}
  labels:
    {{- include "common-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "common-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "common-service.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "common-service.imagePullSecrets" .) }}
      imagePullSecrets:
        {{- . | nindent 8 }}
      {{- end }}
      {{- if or .Values.serviceAccount.create .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name | default (include "common-service.fullname" .) }}
      {{- end }}
      containers:
        - name: {{ include "common-service.name" . }}
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          {{- if or (and (eq .Values.secrets.mode "spring-config") .Values.secrets.springConfig.uri) .Values.externalDb.env .Values.env .Values.observability.enabled }}
          env:
            {{- if and (eq .Values.secrets.mode "spring-config") .Values.secrets.springConfig.uri }}
            - name: SPRING_CLOUD_CONFIG_URI
              value: {{ .Values.secrets.springConfig.uri | quote }}
            {{- end }}
            {{- range $k, $v := .Values.externalDb.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- if .Values.observability.enabled }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: OTEL_SERVICE_NAME
              value: {{ include "common-service.fullname" . | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.observability.otlpEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.observability.otlpProtocol | quote }}
            - name: OTEL_TRACES_EXPORTER
              value: {{ ternary "otlp" "none" .Values.observability.traces | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ ternary "otlp" "none" .Values.observability.metrics | quote }}
            - name: OTEL_LOGS_EXPORTER
              value: {{ ternary "otlp" "none" .Values.observability.logs | quote }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ include "common-service.otelResourceAttributes" . | quote }}
            {{- end }}
          {{- end }}
          {{- $hasEso := eq .Values.secrets.mode "eso" }}
          {{- $hasSpringSecret := and (eq .Values.secrets.mode "spring-config") .Values.secrets.springConfig.credentialsSecret }}
          {{- if or $hasEso $hasSpringSecret .Values.envFrom }}
          envFrom:
            {{- if $hasEso }}
            - secretRef:
                name: {{ include "common-service.fullname" . }}-secrets
            {{- end }}
            {{- if $hasSpringSecret }}
            - secretRef:
                name: {{ .Values.secrets.springConfig.credentialsSecret }}
            {{- end }}
            {{- with .Values.envFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- with .Values.probes.liveness }}
          livenessProbe:
            httpGet:
              path: {{ .path }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
          {{- end }}
          {{- with .Values.probes.readiness }}
          readinessProbe:
            httpGet:
              path: {{ .path }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
