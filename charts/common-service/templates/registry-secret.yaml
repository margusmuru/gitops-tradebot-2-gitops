{{- if .Values.registry.enabled }}
{{- /*
  Private image-registry pull credentials, projected from Vault by ESO into a
  kubernetes.io/dockerconfigjson Secret. dockerconfigjson keys auth by registry HOST
  (registry.server), so a single credential that can read every path under that host
  (e.g. a group-scoped GitLab deploy token with read_registry) covers both the backend
  and UI image paths.

  Vault holds only `username` + `password` (registry.vaultKey); ESO's target template
  builds the dockerconfigjson (the {{ ... }} in the template body below are ESO
  template expressions, passed through verbatim via Helm backtick-literals).

  Two copies when migration is enabled:
    - the main-sync Secret, referenced by the Deployment;
    - a PreSync-hook copy (wave -2), so the migration Job (wave -1) can pull the
      migrator image BEFORE any main-sync resource is applied.
*/}}
{{- $name := include "common-service.registrySecretName" . }}
{{- $server := required "registry.server is required when registry.enabled" .Values.registry.server }}
{{- $vaultKey := required "registry.vaultKey is required when registry.enabled" .Values.registry.vaultKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "common-service.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.eso.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.eso.secretStoreRef.name }}
    kind: {{ .Values.secrets.eso.secretStoreRef.kind }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      # engineVersion + mergePolicy are CRD-defaulted (v2 / Replace); declare them so
      # git == live and ArgoCD doesn't report a permanent cosmetic OutOfSync.
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ $server }}":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .password }}` }}","auth":"{{ `{{ printf "%s:%s" .username .password | b64enc }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ $vaultKey }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ $vaultKey }}
        property: password
{{- if .Values.migration.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-presync
  labels:
    {{- include "common-service.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-2"
spec:
  refreshInterval: {{ .Values.secrets.eso.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secrets.eso.secretStoreRef.name }}
    kind: {{ .Values.secrets.eso.secretStoreRef.kind }}
  target:
    name: {{ $name }}-presync
    creationPolicy: Owner
    template:
      # engineVersion + mergePolicy are CRD-defaulted (v2 / Replace); declare them so
      # git == live and ArgoCD doesn't report a permanent cosmetic OutOfSync.
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ $server }}":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .password }}` }}","auth":"{{ `{{ printf "%s:%s" .username .password | b64enc }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ $vaultKey }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ $vaultKey }}
        property: password
{{- end }}
{{- end }}
