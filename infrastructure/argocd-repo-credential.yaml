# ArgoCD -> GitLab repo credential for tradebot-2-gitops, Vault-backed via ESO.
# Applied MANUALLY (out-of-band), once, BEFORE argocd/bootstrap.yaml - this is the
# bootstrap credential that lets ArgoCD clone this private repo, so it cannot be
# GitOps-managed. Requires the Vault-side setup in infrastructure/README.md
# (secret/argocd/tradebot-2-gitops seeded + the argocd-eso policy/role).
---
# Identity ESO uses to authenticate to Vault for the argocd namespace. The Vault role
# `argocd-eso` binds this SA (name + namespace).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-eso
  namespace: argocd
---
# Namespaced store: only serves the argocd namespace. Reads Vault via the scoped
# `argocd-eso` role (read-only on secret/argocd/*).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: argocd-vault
  namespace: argocd
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "argocd-eso"
          serviceAccountRef:
            name: argocd-eso        # namespace defaults to the store's (argocd)
            audiences:              # `aud` claim on the minted token; must match the Vault role's audience
              - vault
---
# Composes the ArgoCD repository Secret: static type/url via the template, username +
# password pulled from Vault. The `repository` label is what makes ArgoCD treat it as a
# repo credential and match it to the repoURL.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tradebot-2-gitops-repo
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: argocd-vault
    kind: SecretStore
  target:
    name: tradebot-2-gitops-repo
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          argocd.argoproj.io/secret-type: repository
      data:
        type: git
        url: https://gitlab.margusm.dev/gitops/tradebot-2-gitops.git
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: argocd/tradebot-2-gitops
        property: username
    - secretKey: password
      remoteRef:
        key: argocd/tradebot-2-gitops
        property: password
