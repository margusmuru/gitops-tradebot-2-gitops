# Default values for mfe. Environment values files are deep-merged on top.

nameOverride: ""
fullnameOverride: ""

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

registry:
  enabled: false
  server: ""
  vaultKey: ""
  secretName: ""
  refreshInterval: 1h
  secretStoreRef:
    name: tradebot-vault
    kind: ClusterSecretStore

replicaCount: 1

containerPort: 80

env: {}

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  host: ""
  path: /
  pathType: Prefix
  annotations: {}
  tls: []

resources:
  requests:
    cpu: 25m
    memory: 64Mi
  limits:
    memory: 128Mi

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
