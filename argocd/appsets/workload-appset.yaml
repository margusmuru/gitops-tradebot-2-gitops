# Discovers every service directory and renders it as a Kustomize source. Each
# environments/<env>/<service>/ has a kustomization.yaml that pulls an in-repo Helm
# chart via Kustomize's helmCharts field (chartHome -> ../../../charts). ArgoCD runs
# `kustomize build --enable-helm` on it.
#
# Requires argocd-cm:
#   kustomize.buildOptions: "--enable-helm --load-restrictor LoadRestrictionsNone"
# (set once on the cluster - see README Prerequisites).
#
# REPLACE every `repoURL` below with the real repository URL.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: workload-applications
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://gitlab.margusm.dev/gitops/tradebot-2-gitops.git
        revision: main
        directories:
          # Every environments/<env>/<service>/ is discovered and synced. Platform
          # (base/kafka, base/redis, ESO/Vault, otel-collector) must be healthy before a
          # backend syncs — they already are. data-service is now enabled (image tags real,
          # DB reachable, Vault keys seeded).
          - path: environments/*/*
          # To hold a service OUT until ready (deps/Vault/images not real), add an explicit
          # entry with exclude: true — it overrides the glob above. Remove it to enable:
          # - path: environments/tradebot-test/gateway
          #   exclude: true
  template:
    metadata:
      # path.segments = [environments, <env>, <service>]
      name: '{{index .path.segments 1}}-{{.path.basename}}'
    spec:
      project: default
      source:
        repoURL: https://gitlab.margusm.dev/gitops/tradebot-2-gitops.git
        targetRevision: main
        path: '{{.path.path}}'
      destination:
        server: https://kubernetes.default.svc
        # One namespace per environment on the same cluster: <env>-app.
        namespace: '{{index .path.segments 1}}-app'
      syncPolicy:
        automated:
          prune: false
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
      # ESO defaults these remoteRef subfields on every ExternalSecret; git omits them, so
      # without this every ExternalSecret shows a permanent cosmetic OutOfSync. Ignore just
      # the defaulted fields (key/property/secretKey still diff normally).
      ignoreDifferences:
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - '.spec.data[].remoteRef.conversionStrategy'
            - '.spec.data[].remoteRef.decodingStrategy'
            - '.spec.data[].remoteRef.metadataPolicy'
            - '.spec.data[].remoteRef.nullBytePolicy'
