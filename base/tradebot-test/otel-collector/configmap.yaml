apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  labels:
    app: otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

    processors:
      # Cap the Collector's own RAM so it can't OOM the node. Keep below the container
      # memory limit (see deployment.yaml) with headroom.
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
        spike_limit_mib: 128

      # Batch to reduce network overhead to the external Grafana stack.
      batch:
        timeout: 1s
        send_batch_size: 1024

      # Stamp everything passing through this Collector with the environment. upsert =
      # add if missing / overwrite if the app sent its own.
      resource:
        attributes:
          - key: deployment.environment
            value: "k8s-test"
            action: upsert

    exporters:
      # 1. TRACES -> Tempo (gRPC) on dev-2-vm-1 (192.168.40.112)
      otlp_grpc/tempo:
        endpoint: "192.168.40.112:4327"
        tls:
          insecure: true

      # 2. METRICS -> Prometheus remote-write (needs --web.enable-remote-write-receiver)
      prometheusremotewrite:
        endpoint: "http://192.168.40.112:9090/api/v1/write"
        # Turn OTel resource attributes (service.name, deployment.environment) into labels.
        resource_to_telemetry_conversion:
          enabled: true

      # 3. LOGS -> Loki (OTLP HTTP)
      otlp_http/loki:
        endpoint: "http://192.168.40.112:3100/otlp"
        tls:
          insecure: true

    extensions:
      # Liveness/readiness target for the Deployment probes.
      health_check:
        endpoint: "0.0.0.0:13133"

    service:
      extensions: [health_check]
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp_grpc/tempo]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, resource, batch]
          exporters: [otlp_http/loki]
