# data-service - reference backend for the tradebot-test environment.
# Exercises every dependency: external Postgres/Timescale (stable DNS + ESO creds),
# in-cluster Redis + Kafka (base components), ESO secrets, Liquibase PreSync migration,
# and the prod,k8s Spring profile (k8s flips Kafka to SCRAM-SHA-512).
# Values here are merged over charts/common-service/values.yaml.

image:
  # PLACEHOLDER registry host - confirm the real $CI_REGISTRY_IMAGE base for margusmuru/tradebot-2.
  repository: registry.margusm.dev/margusmuru/tradebot-2/data-service
  tag: REPLACE_ME            # bumped by CI on every data-service build (commit short SHA)

replicaCount: 1

containerPort: 8081
service:
  port: 8081

# data-service serves under context-path /data-service, so Actuator lives there too.
probes:
  liveness:
    path: /data-service/actuator/health/liveness
  readiness:
    path: /data-service/actuator/health/readiness

# Non-secret env. Activates prod + k8s profiles; k8s layers over prod and overrides only
# the Kafka SASL mechanism (-> SCRAM-SHA-512). In-cluster hosts point at base services.
env:
  SPRING_PROFILES_ACTIVE: prod,k8s
  DATA_SERVICE_REDIS_HOST: redis.tradebot-test-base
  DATA_SERVICE_REDIS_PORT: "6379"
  KAFKA_BOOTSTRAP_SERVER_URL: tradebot-kafka-bootstrap.tradebot-test-base:9092
  KAFKA_USERNAME: data-service
  # OTLP push to the external Grafana stack (Micrometer props, not the OTEL_* agent vars).
  MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://otel-collector.observability.example:4318/v1/metrics
  MANAGEMENT_OTLP_TRACING_ENDPOINT: http://otel-collector.observability.example:4317
  MANAGEMENT_OTLP_LOGGING_ENDPOINT: http://otel-collector.observability.example:4317

# External Postgres/Timescale on a separate machine, reached via a stable in-cluster name.
externalDb:
  enabled: true
  stableDns:
    enabled: true
    serviceName: data-service-db
    externalName: postgres.db.internal      # PLACEHOLDER - real Timescale/Postgres host
  env:
    DB_DATA_SERVICE_URL: jdbc:postgresql://data-service-db:5432/tradebot

# App runtime secrets, projected from Vault. DB user is the app user (tradebot); only the
# password is secret. Redis + Kafka passwords come from the shared/per-user Vault paths.
secrets:
  mode: eso
  eso:
    secretStoreRef:
      name: tradebot-vault
      kind: ClusterSecretStore
    refreshInterval: 1h
    data:
      - secretKey: DB_DATA_SERVICE_APP_PASSWORD
        remoteRef: { key: tradebot-test/data-service, property: db-password }
      - secretKey: DATA_SERVICE_REDIS_PASSWORD
        remoteRef: { key: tradebot-test/redis, property: password }
      - secretKey: KAFKA_PASSWORD
        remoteRef: { key: tradebot-test/kafka/data-service, property: password }

# Liquibase migration as an ArgoCD PreSync hook. Runs as the DB superuser (postgres),
# so its own ExternalSecret pulls the migrator credential (separate from the app user).
migration:
  enabled: true
  # PLACEHOLDER registry host.
  repository: registry.margusm.dev/margusmuru/tradebot-2/db-migrator-data-service
  tag: REPLACE_ME            # bumped by CI only on database/data-service/** changes
  dbUrl: jdbc:postgresql://data-service-db:5432/tradebot
  eso:
    data:
      - secretKey: LIQUIBASE_DB_USERNAME
        remoteRef: { key: tradebot-test/data-service, property: db-migrator-username }
      - secretKey: LIQUIBASE_DB_PASSWORD
        remoteRef: { key: tradebot-test/data-service, property: db-migrator-password }

resources:
  requests:
    cpu: 250m
    memory: 768Mi
  limits:
    memory: 1536Mi
