# whoami - the minimal, zero-dependency smoke test. A tiny public image, no secrets,
# no external DB, no Kafka/Redis, no observability, no ingress. Deploys on any cluster
# that has ArgoCD - nothing else required. Use it to prove the pipeline end-to-end
# before touching the fuller services.
#
# It also demonstrates overriding the probe path: whoami is NOT a Spring Boot Actuator
# app, so the probes point at `/` instead of the chart default /actuator/health/*.

image:
  repository: traefik/whoami
  tag: v1.10.2

containerPort: 80

service:
  port: 80

probes:
  liveness:
    path: /
  readiness:
    path: /

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    memory: 32Mi
