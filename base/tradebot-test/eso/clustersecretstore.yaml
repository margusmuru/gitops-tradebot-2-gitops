apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: tradebot-vault
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "tradebot-test-eso"
          audiences:
            - vault
          serviceAccountRef:
            name: tradebot-eso
            namespace: tradebot-test-base
