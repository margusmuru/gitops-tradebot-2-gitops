{{- if .Values.registry.enabled }}
{{- $name := include "mfe.registrySecretName" . }}
{{- $server := required "registry.server is required when registry.enabled" .Values.registry.server }}
{{- $vaultKey := required "registry.vaultKey is required when registry.enabled" .Values.registry.vaultKey }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}
  labels:
    {{- include "mfe.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.registry.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.registry.secretStoreRef.name }}
    kind: {{ .Values.registry.secretStoreRef.kind }}
  target:
    name: {{ $name }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{ $server }}":{"username":"{{ `{{ .username }}` }}","password":"{{ `{{ .password }}` }}","auth":"{{ `{{ printf "%s:%s" .username .password | b64enc }}` }}"}}}
  data:
    - secretKey: username
      remoteRef:
        key: {{ $vaultKey }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ $vaultKey }}
        property: password
{{- end }}
