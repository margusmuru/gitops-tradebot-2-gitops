{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default (include "common-service.fullname" .) }}
  labels:
    {{- include "common-service.labels" . | nindent 4 }}
# App calls no Kubernetes API (secrets via ESO->envFrom, downstream via static DNS), so the
# token is not mounted into pods using this SA - no stealable API credential in the pod.
automountServiceAccountToken: {{ .Values.serviceAccount.automountToken }}
{{- end }}
